name: Release App Artifacts
on:
  push:
    tags: [v*]

# This fork builds a single artifact: a 64-bit Windows (x64) build of the Yaak desktop
# app, produced from crates-tauri/yaak-app-client via the WRY runtime. The updater and
# license (remote entitlement check) Cargo features are intentionally left out of
# tauri.release.conf.json, so this build never talks to Yaak's update/license servers.
jobs:
  build-artifacts:
    permissions:
      contents: write

    name: Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          cache-on-failure: true

      - name: Install Protoc for plugin-runtime
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - run: vp install
      - run: npm run bootstrap
        env:
          YAAK_TARGET_ARCH: "x64"
      - run: npm run lint
      - name: Run JS Tests
        run: vp test
      - name: Run Rust Tests
        run: cargo test --all --exclude yaak-cli --features yaak-app-client/wry

      - name: Set version
        run: npm run replace-version
        env:
          YAAK_VERSION: ${{ github.ref_name }}

      # No code-signing secrets are configured for this fork, so the .exe/NSIS installer
      # ship unsigned. tauri.release.conf.json has no windows.signCommand, so the build
      # succeeds without a certificate. See the project README for how to add Authenticode
      # or Azure Trusted Signing via GitHub secrets if you want signed releases.
      - uses: tauri-apps/tauri-action@v0
        env:
          YAAK_TARGET_ARCH: "x64"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: "node ../../node_modules/@tauri-apps/cli/tauri.js"
          tagName: "v__VERSION__"
          releaseName: "Release __VERSION__"
          releaseBody: "<!-- generated-by-yaak-releases -->"
          releaseDraft: true
          prerelease: true
          projectPath: ./crates-tauri/yaak-app-client
          args: "--config ./tauri.release.conf.json"
